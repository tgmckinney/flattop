[project]
name = "flattop"
version = "0.1.0"
description = "WW2 Pacific carrier campaign engine: phased orders, fog of war, auto or tabletop battle resolution"
readme = "README.md"
authors = [
    { name = "Thomas G. McKinney Jr.", email = "tgmckinney@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "uvicorn>=0.54.0",
]


[project.scripts]
flattop-server = "flattop.server:main"
[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
